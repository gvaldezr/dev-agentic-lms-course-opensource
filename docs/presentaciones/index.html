<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Perfil del Community Manager | UADY</title>
    <style>
        :root {
            --uady-azul: #192E4C;
            --uady-dorado: #C89211;
            --uady-azul-claro: #2A4A7A;
            --uady-azul-oscuro: #0f1d33;
            --uady-dorado-claro: #e5b030;
            --uady-azul-fondo: #F0F3F7;
            --uady-gris-claro: #F5F5F5;
            --uady-gris-oscuro: #666666;
            --uady-font-logo: 'Lucida Bright', Georgia, serif;
            --uady-font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--uady-font-body);
            background: var(--uady-azul-fondo);
            min-height: 100vh;
            color: #333;
            padding: 0;
        }
        .header-institucional {
            background: var(--uady-azul);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-institucional img {
            height: 48px;
            width: auto;
        }
        .header-institucional .asignatura {
            font-family: var(--uady-font-logo);
            color: var(--uady-dorado);
            font-size: 0.85rem;
            text-transform: uppercase;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 24px 0 16px;
        }
        header h1 {
            font-family: var(--uady-font-logo);
            font-size: 1.6rem;
            color: var(--uady-azul);
            margin-bottom: 8px;
        }
        header p {
            color: var(--uady-gris-oscuro);
            font-size: 0.95rem;
        }
        .progress-bar {
            background: rgba(25,46,76,0.1);
            border-radius: 20px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--uady-dorado), var(--uady-dorado-claro));
            height: 100%;
            border-radius: 20px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--uady-gris-oscuro);
            margin-bottom: 20px;
        }
        .question-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(25,46,76,0.06);
            transition: all 0.3s ease;
        }
        .question-card.correct {
            border-color: #4caf50;
            background: rgba(76,175,80,0.04);
        }
        .question-card.incorrect {
            border-color: #dc3545;
            background: rgba(220,53,69,0.04);
        }
        .question-number {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--uady-dorado);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .question-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--uady-azul);
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.5;
            background: var(--uady-gris-claro);
        }
        .option:hover:not(.disabled) {
            background: rgba(200,146,17,0.08);
            border-color: var(--uady-dorado);
        }
        .option.selected {
            background: rgba(200,146,17,0.1);
            border-color: var(--uady-dorado);
        }
        .option.disabled { cursor: default; opacity: 0.7; }
        .option.correct-answer {
            background: rgba(76,175,80,0.1) !important;
            border-color: #4caf50 !important;
            opacity: 1 !important;
        }
        .option.wrong-answer {
            background: rgba(220,53,69,0.1) !important;
            border-color: #dc3545 !important;
            opacity: 1 !important;
        }
        .option-letter {
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--uady-azul);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .feedback {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct-fb {
            background: rgba(76,175,80,0.08);
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        .feedback.incorrect-fb {
            background: rgba(220,53,69,0.08);
            border-left: 4px solid #dc3545;
            color: #c62828;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--uady-azul);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(25,46,76,0.25); }
        .btn-secondary {
            background: transparent;
            color: var(--uady-dorado);
            border: 2px solid var(--uady-dorado);
        }
        .btn-secondary:hover { background: rgba(200,146,17,0.08); }
        .actions {
            text-align: center;
            margin: 30px 0;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .results-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            display: none;
            box-shadow: 0 2px 8px rgba(25,46,76,0.06);
        }
        .results-card.show { display: block; }
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
        }
        .score-circle.high { background: rgba(76,175,80,0.1); border: 3px solid #4caf50; color: #4caf50; }
        .score-circle.medium { background: rgba(200,146,17,0.1); border: 3px solid var(--uady-dorado); color: var(--uady-dorado); }
        .score-circle.low { background: rgba(220,53,69,0.1); border: 3px solid #dc3545; color: #dc3545; }
        .score-label { font-size: 0.8rem; font-weight: 400; margin-top: 4px; }
        .results-message { font-size: 1.1rem; margin: 16px 0 30px; color: var(--uady-gris-oscuro); }
        .topic-breakdown { text-align: left; margin: 20px 0; }
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: var(--uady-azul-fondo);
        }
        .topic-name { font-size: 0.9rem; color: var(--uady-azul); }
        .topic-score { font-size: 0.85rem; font-weight: 600; }
        .hidden { display: none; }
        .footer-lema {
            text-align: center;
            padding: 24px 0;
            font-family: var(--uady-font-logo);
            font-style: italic;
            font-weight: 600;
            color: var(--uady-dorado);
            font-size: 0.95rem;
        }
        @media (max-width: 600px) {
            body { padding: 0; }
            .container { padding: 12px; }
            .question-card { padding: 20px; }
            header h1 { font-size: 1.3rem; }
            .header-institucional { padding: 12px 16px; }
            .header-institucional img { height: 36px; }
        }
    </style>
</head>

// Shuffle and pick 10
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

let selectedQuestions = [];
let userAnswers = [];
let quizSubmitted = false;

function initQuiz() {
    // Seleccionar preguntas balanceadas por tema
    const topics = ["Rol del CM", "Influencia del CM", "Monitorización", "Dinamización"];
    let picked = [];
    
    // Tomar al menos 2 de cada tema, luego rellenar aleatoriamente
    topics.forEach(topic => {
        const topicQs = shuffle(questionPool.filter(q => q.topic === topic));
        picked.push(...topicQs.slice(0, 2));
    });
    
    // Rellenar hasta 10 con preguntas restantes
    const remaining = shuffle(questionPool.filter(q => !picked.includes(q)));
    picked.push(...remaining.slice(0, 10 - picked.length));
    
    selectedQuestions = shuffle(picked).slice(0, 10);
    userAnswers = new Array(10).fill(null);
    quizSubmitted = false;
    
    renderQuestions();
    updateProgress();
    
    document.getElementById('results-card').classList.remove('show');
    document.getElementById('quiz-section').classList.remove('hidden');
    document.getElementById('btn-submit').classList.remove('hidden');
    document.getElementById('btn-retry').classList.add('hidden');
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    selectedQuestions.forEach((q, qi) => {
        const letters = ['a', 'b', 'c', 'd'];
        let optionsHTML = q.options.map((opt, oi) => `
            <div class="option" id="opt-${qi}-${oi}" onclick="selectOption(${qi}, ${oi})">
                <span class="option-letter">${letters[oi]}</span>
                <span>${opt}</span>
            </div>
        `).join('');
        
        container.innerHTML += `
            <div class="question-card" id="card-${qi}">
                <div class="question-number">Pregunta ${qi + 1} — ${q.topic}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="feedback" id="feedback-${qi}"></div>
            </div>
        `;
    });
}

function selectOption(qi, oi) {
    if (quizSubmitted) return;
    
    userAnswers[qi] = oi;
    
    // Visual selection
    for (let i = 0; i < 4; i++) {
        document.getElementById(`opt-${qi}-${i}`).classList.remove('selected');
    }
    document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
    
    updateProgress();
}

function updateProgress() {
    const answered = userAnswers.filter(a => a !== null).length;
    const pct = (answered / 10) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${answered} de 10 preguntas respondidas`;
}

function submitQuiz() {
    const unanswered = userAnswers.filter(a => a === null).length;
    if (unanswered > 0) {
        if (!confirm(`Tienes ${unanswered} pregunta(s) sin responder. ¿Enviar de todos modos?`)) return;
    }
    
    quizSubmitted = true;
    let score = 0;
    const topicScores = {};
    
    selectedQuestions.forEach((q, qi) => {
        const card = document.getElementById(`card-${qi}`);
        const feedback = document.getElementById(`feedback-${qi}`);
        const isCorrect = userAnswers[qi] === q.correct;
        
        if (isCorrect) score++;
        
        // Track topic scores
        if (!topicScores[q.topic]) topicScores[q.topic] = { correct: 0, total: 0 };
        topicScores[q.topic].total++;
        if (isCorrect) topicScores[q.topic].correct++;
        
        // Style card
        card.classList.add(isCorrect ? 'correct' : 'incorrect');
        
        // Style options
        for (let i = 0; i < 4; i++) {
            const opt = document.getElementById(`opt-${qi}-${i}`);
            opt.classList.add('disabled');
            if (i === q.correct) opt.classList.add('correct-answer');
            if (i === userAnswers[qi] && !isCorrect) opt.classList.add('wrong-answer');
        }
        
        // Show feedback
        feedback.className = `feedback show ${isCorrect ? 'correct-fb' : 'incorrect-fb'}`;
        feedback.innerHTML = isCorrect 
            ? `✅ <strong>¡Correcto!</strong> ${q.feedback}`
            : `❌ <strong>Incorrecto.</strong> ${q.feedback}`;
    });
    
    // Show results
    showResults(score, topicScores);
    
    document.getElementById('btn-submit').classList.add('hidden');
    document.getElementById('btn-retry').classList.remove('hidden');
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResults(score, topicScores) {
    const resultsCard = document.getElementById('results-card');
    const scoreCircle = document.getElementById('score-circle');
    const scoreNumber = document.getElementById('score-number');
    const resultsMessage = document.getElementById('results-message');
    const breakdown = document.getElementById('topic-breakdown');
    
    scoreNumber.textContent = score;
    scoreCircle.className = 'score-circle ' + (score >= 8 ? 'high' : score >= 6 ? 'medium' : 'low');
    
    if (score >= 9) resultsMessage.textContent = '¡Excelente! Dominas los conceptos del perfil del Community Manager.';
    else if (score >= 7) resultsMessage.textContent = 'Buen resultado. Refuerza los temas donde fallaste para consolidar tu comprensión.';
    else if (score >= 5) resultsMessage.textContent = 'Resultado regular. Te recomiendo repasar las lecturas y prestar atención a las diferencias entre conceptos.';
    else resultsMessage.textContent = 'Necesitas repasar. Vuelve a leer los contenidos del módulo y pon atención a los ejemplos prácticos.';
    
    // Topic breakdown
    let breakdownHTML = '<h3 style="margin-bottom:12px; color:#192E4C; font-size:1rem;">Desempeño por tema:</h3>';
    Object.entries(topicScores).forEach(([topic, data]) => {
        const pct = Math.round((data.correct / data.total) * 100);
        const color = pct >= 80 ? '#4caf50' : pct >= 50 ? '#C89211' : '#dc3545';
        breakdownHTML += `
            <div class="topic-row">
                <span class="topic-name">${topic}</span>
                <span class="topic-score" style="color:${color}">${data.correct}/${data.total} (${pct}%)</span>
            </div>
        `;
    });
    breakdown.innerHTML = breakdownHTML;
    
    resultsCard.classList.add('show');
}

function retryQuiz() {
    initQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize on load
initQuiz();
